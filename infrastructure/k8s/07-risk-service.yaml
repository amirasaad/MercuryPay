---
# Risk Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: risk-service
  namespace: mercurypay
  labels:
    app: risk-service
    service: risk
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: risk-service
  template:
    metadata:
      labels:
        app: risk-service
        service: risk
    spec:
      serviceAccountName: mercurypay-services
      containers:
      - name: risk-service
        image: mercurypay/risk-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        env:
        - name: ASPNETCORE_URLS
          value: "http://+:8080"
        - name: ASPNETCORE_ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: mercurypay-config
              key: ASPNETCORE_ENVIRONMENT
        - name: ConnectionStrings__RiskDb
          valueFrom:
            secretKeyRef:
              name: mercurypay-secrets
              key: RISK_DB_CONNECTION
        - name: ConnectionStrings__messaging
          valueFrom:
            secretKeyRef:
              name: mercurypay-secrets
              key: MESSAGING_CONNECTION
        - name: Identity__Authority
          valueFrom:
            configMapKeyRef:
              name: mercurypay-config
              key: KEYCLOAK_AUTHORITY
        - name: Identity__Audience
          value: "account"
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: mercurypay-config
              key: OTEL_EXPORTER_OTLP_ENDPOINT
        - name: OTEL_SERVICE_NAME
          value: "risk-service"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /alive
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - risk-service
              topologyKey: kubernetes.io/hostname

---
apiVersion: v1
kind: Service
metadata:
  name: risk-service
  namespace: mercurypay
  labels:
    app: risk-service
spec:
  type: ClusterIP
  selector:
    app: risk-service
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http
