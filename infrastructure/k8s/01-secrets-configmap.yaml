---
apiVersion: v1
kind: Secret
metadata:
  name: mercurypay-secrets
  namespace: mercurypay
type: Opaque
stringData:
  # PostgreSQL credentials
  POSTGRES_USER: mercurypay
  POSTGRES_PASSWORD: "ChangeMe123!SecurePassword"
  
  # Redis (if auth required)
  REDIS_PASSWORD: "ChangeMe123!RedisPassword"
  
  # JWT signing key
  JWT_SECRET_KEY: "your-secure-jwt-secret-key-change-in-production"
  
  # Database connection strings (referenced by services)
  PAYMENT_DB_CONNECTION: "User ID=mercurypay;Password=ChangeMe123!SecurePassword;Server=postgres.mercurypay.svc.cluster.local;Port=5432;Database=payment_db;"
  WALLET_DB_CONNECTION: "User ID=mercurypay;Password=ChangeMe123!SecurePassword;Server=postgres.mercurypay.svc.cluster.local;Port=5432;Database=wallet_db;"
  LENDING_DB_CONNECTION: "User ID=mercurypay;Password=ChangeMe123!SecurePassword;Server=postgres.mercurypay.svc.cluster.local;Port=5432;Database=lending_db;"
  RISK_DB_CONNECTION: "User ID=mercurypay;Password=ChangeMe123!SecurePassword;Server=postgres.mercurypay.svc.cluster.local;Port=5432;Database=risk_db;"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mercurypay-config
  namespace: mercurypay
data:
  # Service discovery via Kubernetes DNS
  REDIS_HOST: "redis.mercurypay.svc.cluster.local"
  REDIS_PORT: "6379"
  REDIS_STREAM_NAME: "mercurypay-events"
  
  POSTGRES_HOST: "postgres.mercurypay.svc.cluster.local"
  POSTGRES_PORT: "5432"
  
  # Service endpoints
  PAYMENT_SERVICE_URL: "http://payment-service.mercurypay.svc.cluster.local:8080"
  WALLET_SERVICE_URL: "http://wallet-service.mercurypay.svc.cluster.local:8080"
  LENDING_SERVICE_URL: "http://lending-service.mercurypay.svc.cluster.local:8080"
  RISK_SERVICE_URL: "http://risk-service.mercurypay.svc.cluster.local:8080"
  
  # Observability
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.mercurypay.svc.cluster.local:4317"
  OTEL_SERVICE_NAME: "mercurypay"
  
  # Environment
  ASPNETCORE_ENVIRONMENT: "Production"
  DOTNET_ENVIRONMENT: "Production"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: mercurypay
data:
  init-databases.sql: |
    -- Create databases for each service (database-per-service pattern)
    CREATE DATABASE payment_db;
    CREATE DATABASE wallet_db;
    CREATE DATABASE lending_db;
    CREATE DATABASE risk_db;
