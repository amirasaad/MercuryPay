name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  NUGET_XMLDOC_MODE: skip

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true

      - name: Restore
        run: dotnet restore MercuryPay.slnx --locked-mode

      - name: Build
        run: dotnet build MercuryPay.slnx -c Release --no-restore

      - name: Unit tests
        run: |
          dotnet test tests/UnitTests/MercuryPay.Workflow.Tests/MercuryPay.Workflow.Tests.csproj -c Release --no-build
          dotnet test tests/UnitTests/LendingService.Tests/MercuryPay.LendingService.Tests.csproj -c Release --no-build
          dotnet test tests/UnitTests/PaymentService.Tests/MercuryPay.PaymentService.Tests.csproj -c Release --no-build
          dotnet test tests/UnitTests/WalletService.Tests/MercuryPay.WalletService.Tests.csproj -c Release --no-build
          dotnet test tests/UnitTests/RiskService.Tests/MercuryPay.RiskService.Tests.csproj -c Release --no-build
          dotnet test tests/UnitTests/Web.Tests/MercuryPay.Web.Tests.csproj -c Release --no-build

  integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true

      - name: Restore
        run: dotnet restore MercuryPay.slnx --locked-mode

      - name: Build
        run: dotnet build MercuryPay.slnx -c Release --no-restore

      - name: Integration tests
        run: |
          dotnet test tests/IntegrationTests/Resilience.Tests/Resilience.Tests.csproj -c Release --no-build
          dotnet test tests/IntegrationTests/MercuryPay.IntegrationTests/MercuryPay.IntegrationTests.csproj -c Release --no-build
